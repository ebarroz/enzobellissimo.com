# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: Enzo Barros Bellissimo
headline: Essays on AI, Automation & Voice Agents
tagline: A quiet place to read about AI, automation, and the craft of building an agency.
description: >-
  Essays and notes by Enzo Barros Bellissimo on AI, automation, and voice
  agents — building systems that qualify leads and book meetings while you sleep.
url: "https://blog.enzobellissimo.com"
baseurl: ""
lang: en
locale: en_US
timezone: America/Sao_Paulo
location: São Paulo, Brazil

# ---------------------------------------------------------------------------
# Author / identity graph (feeds JSON-LD `sameAs`, rel="me", and the footer)
# ---------------------------------------------------------------------------
author:
  name: Enzo Barros Bellissimo
  first_name: Enzo
  last_name: Bellissimo
  job_title: Founder, Similar Info — custom software & AI agents
  url: "https://blog.enzobellissimo.com/about/"

# Company (feeds the footer, About, and the JSON-LD Person → worksFor)
company:
  name: Similar Info
  legal_name: Similar Tecnologia e Inteligência Artificial Ltda
  url: https://similarinfo.com/?utm_source=blog&utm_medium=referral
  canonical_url: https://similarinfo.com/
  instagram: https://www.instagram.com/smartsimilar/
  location: Alphaville, Barueri, SP — Brazil

social:
  name: Enzo Barros Bellissimo
  links:
    - https://github.com/ebarroz
    - https://www.linkedin.com/in/enzobbellissimo/

# Rendered as icon links in the footer + as rel="me" in <head>.
social_profiles:
  - name: GitHub
    handle: ebarroz
    url: https://github.com/ebarroz
    icon: github
  - name: LinkedIn
    handle: enzobbellissimo
    url: https://www.linkedin.com/in/enzobbellissimo/
    icon: linkedin
  # scope: company → rendered in the footer, but NOT rel="me" / Person.sameAs
  # (those assert "same human"; the company lives in Organization.sameAs).
  - name: Similar Info
    handle: similarinfo.com
    url: https://similarinfo.com/?utm_source=blog&utm_medium=referral
    icon: globe
    scope: company
  - name: Instagram
    handle: smartsimilar
    url: https://www.instagram.com/smartsimilar/
    icon: instagram
    scope: company

# ---------------------------------------------------------------------------
# Branding assets used by the SEO head
# ---------------------------------------------------------------------------
logo: /assets/logo-512.png
og_image: /assets/og-default.png
og_image_width: 1200
og_image_height: 630
title_separator: "·"

# Paste the token from Google Search Console / Bing Webmaster Tools here and the
# verification <meta> appears site-wide. Left blank = tag omitted entirely.
google_site_verification:
bing_site_verification:

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
permalink: /:title/
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 2..3
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Enzo Barros Bellissimo

exclude:
  - README.md
  - tools/
  - .claude/

# CNAME must reach _site/ for the custom domain, so it is never excluded.
include:
  - .well-known
