<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Enzo Barros Bellissimo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset=".48" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <rect width="64" height="64" rx="16" fill="url(#sheen)"/>
  <!-- E: spine + three arms; middle arm shorter -->
  <g fill="#f5f1e8">
    <rect x="18" y="16" width="8" height="32" rx="1.5"/>
    <rect x="18" y="16" width="28" height="7" rx="1.5"/>
    <rect x="18" y="28.5" width="21" height="7" rx="1.5"/>
    <rect x="18" y="41" width="28" height="7" rx="1.5"/>
  </g>
  <!-- ember dot: the "next word" -->
  <circle cx="45" cy="32" r="2.6" fill="#fde68a"/>
</svg>
